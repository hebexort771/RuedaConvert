# Definición del proyecto para XcodeGen (https://github.com/yonaskolb/XcodeGen).
# El RuedaConvert.xcodeproj incluido ya está generado a partir de este archivo.
# Si cambias algo aquí, regenéralo con:  brew install xcodegen && xcodegen
name: RuedaConvert
options:
  bundleIdPrefix: com.hebergomez
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: es
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  RuedaConvert:
    type: application
    platform: macOS
    scheme: {}
    deploymentTarget: "13.0"
    sources:
      - path: Sources
      - path: Resources
      - path: Support
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: RuedaConvert
        PRODUCT_BUNDLE_IDENTIFIER: com.hebergomez.ruedaconvert
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Support/RuedaConvert.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
