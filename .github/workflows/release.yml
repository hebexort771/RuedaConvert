# Compila RuedaConvert en un Mac de GitHub y publica RuedaConvert-macOS.zip en Releases.
#
# Se activa con cualquier etiqueta que empiece con "v" (v1.0, v1.1…). La forma más fácil:
# GitHub → Releases → "Draft a new release" → Choose a tag → escribe v1.1 → Publish.
# En unos minutos el .zip aparece en esa versión, y el botón "Descargar para Mac"
# de la página web siempre apunta a la última.
#
# También puedes lanzarlo a mano (Actions → Compilar app → Run workflow) para
# probar: el .zip queda como artefacto de esa ejecución.
name: Compilar app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular versión
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar (Apple Silicon + Intel)
        run: |
          xcodebuild -project RuedaConvert.xcodeproj -scheme RuedaConvert \
            -configuration Release -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build

      - name: Empaquetar
        run: |
          APP="build/Build/Products/Release/RuedaConvert.app"
          codesign --verify --deep --strict "$APP"
          lipo -info "$APP/Contents/MacOS/RuedaConvert"
          ditto -c -k --sequesterRsrc --keepParent "$APP" RuedaConvert-macOS.zip

      - name: Publicar en Releases
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "RuedaConvert ${TAG#v}" --notes-file .github/release-notes.md
          fi
          gh release upload "$TAG" RuedaConvert-macOS.zip --repo "$GITHUB_REPOSITORY" --clobber

      - name: Guardar como artefacto (ejecución manual)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: RuedaConvert-macOS
          path: RuedaConvert-macOS.zip
